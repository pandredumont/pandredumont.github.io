<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2E3325" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="robots" content="noindex" />
<title>LKCNHM Field Challenge</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #23261C;
    color: #EFF1E6;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
  }
  /* stop iOS zooming the page when a field is focused */
  input, textarea, select { font-size: 16px; }
  #root { min-height: 100vh; }

  .lkc-spark { position:absolute; width:7px; height:7px; border-radius:50%;
    opacity:0; animation: lkcSpark 1.15s ease-out forwards; will-change: transform, opacity; }
  @keyframes lkcSpark {
    0%   { transform: translate(0,0) scale(.45); opacity:0; }
    12%  { opacity:1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity:0; }
  }
  .lkc-pop { animation: lkcPop .62s cubic-bezier(.2,1.3,.4,1) .2s both; }
  @keyframes lkcPop { 0% { transform:scale(.72); opacity:0; } 100% { transform:scale(1); opacity:1; } }
  .lkc-fade { animation: lkcFade .5s ease .9s both; }
  @keyframes lkcFade { from { opacity:0; } to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) {
    .lkc-spark { display:none; }
    .lkc-pop, .lkc-fade { animation:none; opacity:1; transform:none; }
  }
  #boot { padding: 40px 20px; font: 15px system-ui, sans-serif; color: #AAB39A; }
</style>
</head>
<body>
<div id="root"><div id="boot">Opening the collection…</div></div>
